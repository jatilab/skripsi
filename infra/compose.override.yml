volumes:
  postgres_data_local:

services:
  pgbouncer:
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@postgres/postgres
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      SERVER_LOGIN_RETRY: 1
      SERVER_CONNECT_TIMEOUT: 1
    ports:
      - target: 5432
        published: 5432
    deploy:
      replicas: 1

  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data_local:/var/lib/postgresql

  traefik:
    ports:
      - target: 80
        published: 80
      - target: 8080
        published: 8080
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=public
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --log.level=info
      - --ping=true
      - --api.insecure=true
    deploy:
      replicas: 1

  cloudflared:
    profiles:
      - disabled
