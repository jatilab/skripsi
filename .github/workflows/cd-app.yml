name: CD App

on:
  workflow_dispatch:

concurrency: cd-app-deploy

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/skripsi-app:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/skripsi-app:latest
      - id: image
        run: echo "image=ghcr.io/${{ github.repository }}/skripsi-app:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: self-hosted
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.build.outputs.image }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for net in public private; do
            docker network create --driver overlay --attachable $net 2>/dev/null || true
          done
      - run: docker run --rm --network private -e DB_HOST=postgres -e DB_PASSWORD=${{ env.DB_PASSWORD }} ${{ env.APP_IMAGE }} node scripts/migrate.mjs
      - run: docker stack deploy --detach=false --with-registry-auth --compose-file=compose.yml skripsi-app
      - run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 --max-time 10 https://${{ env.APP_DOMAIN }}/livez >/dev/null
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 --max-time 10 https://${{ env.APP_DOMAIN }}/readyz >/dev/null

  k6-run:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/k6:/k6" \
            -e APP_DOMAIN=${{ secrets.APP_DOMAIN }} \
            grafana/k6 run --summary-export=/k6/k6-results.json /k6/script.js || true
      - uses: actions/upload-artifact@v7
        with:
          name: k6-results
          path: k6/k6-results.json
          if-no-files-found: ignore

  k6-baseline:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/k6:/k6" \
            -e APP_DOMAIN=${{ secrets.APP_DOMAIN }} \
            -e DURATION=1m \
            grafana/k6 run --summary-export=/k6/k6-baseline.json /k6/script.js || true
      - uses: actions/upload-artifact@v7
        with:
          name: k6-baseline-results
          path: k6/k6-baseline.json
          if-no-files-found: ignore

  k6-report:
    runs-on: ubuntu-latest
    needs: [deploy, k6-run, k6-baseline]
    if: always() && needs.k6-run.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: k6-results
          path: k6
        continue-on-error: true
      - uses: actions/download-artifact@v7
        with:
          name: k6-baseline-results
          path: k6
        continue-on-error: true
      - run: node k6/report.mjs
