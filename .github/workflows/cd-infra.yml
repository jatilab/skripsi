name: CD Infra

on:
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:

concurrency: cd-infra-deploy

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          for net in public private; do
            docker network create --driver overlay --attachable $net 2>/dev/null || true
          done
      - run: docker stack deploy --detach=false --compose-file=infra/compose.yml skripsi-infra
      - run: |
          for _ in $(seq 1 30); do
            out=$(docker service ls --filter name=skripsi-infra_ --format '{{.Replicas}}')
            fail=$(grep -E '[0-9]+/[0-9]+' <<< "$out" | awk -F'/' '$1 != $2' | wc -l | tr -d ' ')
            if [ -n "$out" ] && [ "$fail" -eq 0 ]; then
              docker service ls --filter name=skripsi-infra_
              exit 0
            fi
            sleep 2
          done
          docker service ls --filter name=skripsi-infra_
          exit 1
